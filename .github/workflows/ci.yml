name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    # The toolchain and the libraries Fedora builds with.
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git-core rust cargo rustfmt clippy just blueprint-compiler
          gtk4-devel libadwaita-devel glib2-devel
          desktop-file-utils appstream gettext
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Lint
        run: just check
      - name: Test
        run: just test

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  aur:
    name: AUR
    needs: [check, deny]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/aur.yml
