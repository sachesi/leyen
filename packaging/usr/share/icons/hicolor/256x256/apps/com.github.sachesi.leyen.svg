<svg width="256" height="258" viewBox="0 0 258 258" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Game launcher horizontal tiles icon</title>
  <desc>A minimal blue gradient squircle with three centered horizontal game tiles</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="bglight" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#62a0ea" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a5fb4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tilehi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ddeeff" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="tiledim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="130" rx="52" ry="52" fill="url(#bglight)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="none" stroke="#5ba5ed" stroke-width="2" stroke-opacity="0.4"/>

  <rect x="44" y="47" width="168" height="46" rx="12" fill="url(#tiledim)" stroke="white" stroke-width="1.5" stroke-opacity="0.25"/>
  <rect x="66" y="62" width="72" height="8" rx="4" fill="white" fill-opacity="0.22"/>
  <rect x="66" y="74" width="44" height="6" rx="3" fill="white" fill-opacity="0.13"/>

  <rect x="44" y="105" width="168" height="46" rx="12" fill="url(#tilehi)"/>
  <polygon points="66,118 66,144 90,131" fill="#1a5fb4" fill-opacity="0.5"/>
  <rect x="100" y="119" width="76" height="9" rx="4" fill="#1a5fb4" fill-opacity="0.22"/>
  <rect x="100" y="133" width="48" height="7" rx="3" fill="#1a5fb4" fill-opacity="0.14"/>

  <rect x="44" y="163" width="168" height="46" rx="12" fill="url(#tiledim)" stroke="white" stroke-width="1.5" stroke-opacity="0.25"/>
  <rect x="66" y="178" width="72" height="8" rx="4" fill="white" fill-opacity="0.22"/>
  <rect x="66" y="190" width="44" height="6" rx="3" fill="white" fill-opacity="0.13"/>
